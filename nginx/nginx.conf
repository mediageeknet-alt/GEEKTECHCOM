user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Sembunyikan versi Nginx dari header respons
    server_tokens off;

    # Logging terstruktur
    log_format main_ext '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for" '
                        'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main_ext;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    client_max_body_size 10M;

    # Zona Rate Limit Lapis Pertama di Edge Nginx (sebelum menyentuh Redis Rate Limiter Backend)
    limit_req_zone $binary_remote_addr zone=public_track_zone:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=admin_api_zone:10m rate=60r/m;
    limit_conn_zone $binary_remote_addr zone=addr_conn:10m;

    upstream frontend_upstream {
        server frontend:3000;
        keepalive 32;
    }

    upstream backend_upstream {
        server backend:4000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name track.geektech-com.id;

        # Security Headers Ketat
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; connect-src 'self';" always;

        # 1. Endpoint Public Tracking & Approval: Blokir method selain POST di level Reverse Proxy
        location ~ ^/api/v1/public/(track|approve-cost)$ {
            limit_req zone=public_track_zone burst=3 nodelay;
            limit_conn addr_conn 10;

            if ($request_method !~ ^(POST|OPTIONS)$) {
                return 405 '{"error":"Method Not Allowed. Gunakan POST untuk mencegah kebocoran parameter di URL."}';
            }

            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 2. Endpoint API Backend Lainnya (Admin & Auth)
        location /api/v1/ {
            limit_req zone=admin_api_zone burst=20 nodelay;

            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass_header Set-Cookie;
        }

        # 3. Trafik Utama ke Frontend Next.js / React
        location / {
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
